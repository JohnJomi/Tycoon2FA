# Pytest configuration.
#
# `testpaths` scopes collection to tests/ so nothing under .venv/, data/ or
# models/ is ever picked up.
#
# `pythonpath` puts the repository root on sys.path, so `core`, `layers`,
# `ingest`, `scoring`, `storage` and `cli` import as top-level packages when
# pytest is run from the root as plain `pytest`. Without it only invocations
# that happen to seed sys.path themselves - `python -m pytest`, or an explicit
# PYTHONPATH=. - collect at all. Configuration is the right place for this:
# the alternative is either a sys.path-editing conftest.py or making every
# module import relatively, and the layout this project already has is a
# root-level package set meant to be imported by name.
[pytest]
testpaths = tests
pythonpath = .
